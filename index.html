<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape The Viva</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #1a0a00;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game-container {
    width: 900px;
    height: 580px;
    background: linear-gradient(135deg, #1a0800 0%, #2d1200 50%, #1a0800 100%);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(255,60,0,0.3);
  }

  #game-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(255,255,255,0.03) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(255,255,255,0.03) 60px);
    pointer-events: none;
  }

  .screen { 
    display: none; 
    width: 100%; 
    height: 100%; 
    position: absolute;
    top: 0; left: 0;
  }
  .screen.active { display: flex; }

  /* ========== START SCREEN ========== */
  #start-screen {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 40px 60px;
    background: linear-gradient(135deg, #0d0500 0%, #1f0900 100%);
  }

  .start-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    z-index: 2;
  }

  .start-title {
    font-size: 58px;
    font-weight: 900;
    line-height: 1;
    text-shadow: 3px 3px 0 #000;
  }
  .start-title .escape { color: #ffffff; }
  .start-title .the { color: #ffffff; }
  .start-title .viva { color: #e63030; }

  .start-subtitle {
    color: #ccc;
    font-size: 13px;
    margin-top: 12px;
    max-width: 240px;
    line-height: 1.5;
    font-style: italic;
  }

  .start-btn {
    margin-top: 30px;
    padding: 14px 36px;
    background: linear-gradient(135deg, #d4920a, #f0b429);
    color: #000;
    font-size: 18px;
    font-weight: 900;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 6px 20px rgba(212,146,10,0.5);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .start-btn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
    animation: btnShine 2s infinite;
  }
  @keyframes btnShine {
    0% { transform: translateX(-100%) rotate(45deg); }
    100% { transform: translateX(100%) rotate(45deg); }
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(212,146,10,0.7); }

  .start-student { position: relative; z-index: 2; }

  /* ========== GAME SCREEN ========== */
  #game-screen {
    flex-direction: column;
    background: linear-gradient(160deg, #0f0600 0%, #1e0b00 60%, #0f0600 100%);
  }

  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid rgba(255,100,0,0.2);
    min-height: 50px;
  }

  .hud-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }

  .hud-label {
    color: #e63030;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .hud-label.anger-label { color: #ff8c00; }

  .bar-container {
    flex: 1;
    height: 14px;
    background: rgba(255,255,255,0.1);
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .bar-fill {
    height: 100%;
    border-radius: 7px;
    transition: width 0.5s ease;
    position: relative;
    overflow: hidden;
  }
  .bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: rgba(255,255,255,0.3);
    border-radius: 7px;
  }

  .stress-bar { background: linear-gradient(90deg, #e63030, #ff6060); }
  .anger-bar { background: linear-gradient(90deg, #d4920a, #ffb830); }

  .bar-pct {
    font-size: 11px;
    font-weight: 700;
    min-width: 32px;
    text-align: right;
  }
  .stress-pct { color: #ff6060; }
  .anger-pct { color: #ffb830; }

  .hud-center { flex: 0.5; text-align: center; }
  .hud-q-num { color: rgba(255,255,255,0.5); font-size: 11px; }

  .game-area {
    display: flex;
    flex: 1;
    padding: 16px 20px;
    gap: 20px;
    overflow: hidden;
    position: relative;
  }

  .prof-panel {
    width: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    flex-shrink: 0;
  }

  .speech-bubble {
    background: #f5f0d8;
    border: 3px solid #c8b878;
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 700;
    color: #222;
    text-align: center;
    line-height: 1.4;
    position: relative;
    width: 100%;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    animation: bubbleAppear 0.3s ease;
  }
  @keyframes bubbleAppear {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    border: 10px solid transparent;
    border-top-color: #c8b878;
  }
  .speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -13px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #f5f0d8;
    z-index: 1;
  }

  .prof-character { margin-top: 24px; position: relative; }
  .prof-character svg { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }

  .prof-angry-effects {
    position: absolute;
    top: -10px;
    right: -10px;
    font-size: 24px;
    display: none;
    animation: angerPulse 0.5s infinite alternate;
  }
  @keyframes angerPulse {
    from { transform: scale(1) rotate(-5deg); }
    to { transform: scale(1.2) rotate(5deg); }
  }

  .questions-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .question-text {
    background: rgba(20,10,0,0.8);
    border: 2px solid rgba(255,150,0,0.3);
    border-radius: 10px;
    padding: 16px 20px;
    color: #f0d090;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    min-height: 70px;
    display: flex;
    align-items: center;
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    background: linear-gradient(90deg, rgba(180,140,60,0.25), rgba(140,100,30,0.15));
    border: 2px solid rgba(180,140,60,0.4);
    border-radius: 8px;
    color: #e8d5a0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .option-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    transition: left 0.3s;
  }
  .option-btn:hover::before { left: 100%; }
  .option-btn:hover:not(:disabled) {
    background: linear-gradient(90deg, rgba(200,160,80,0.4), rgba(180,140,60,0.3));
    border-color: rgba(200,160,80,0.7);
    transform: translateX(4px);
    color: #fff;
  }
  .option-btn:disabled { cursor: default; }

  .option-letter {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
    flex-shrink: 0;
    color: #fff;
  }
  .opt-a .option-letter { background: #2d6e2d; }
  .opt-b .option-letter { background: #1e4fa0; }
  .opt-c .option-letter { background: #7a2d8c; }
  .opt-d .option-letter { background: #b87a10; }

  .option-btn.correct {
    background: linear-gradient(90deg, rgba(30,150,30,0.5), rgba(20,120,20,0.3)) !important;
    border-color: #4cff4c !important;
    color: #fff !important;
    animation: correctPulse 0.4s ease;
  }
  @keyframes correctPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .option-btn.wrong {
    background: linear-gradient(90deg, rgba(180,20,20,0.5), rgba(140,10,10,0.3)) !important;
    border-color: #ff4c4c !important;
    color: #fff !important;
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .stress-change {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.9);
    border-radius: 12px;
    padding: 16px 24px;
    text-align: center;
    font-size: 26px;
    font-weight: 900;
    z-index: 100;
    border: 3px solid;
    animation: stressPopup 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: none;
  }
  @keyframes stressPopup {
    from { transform: translateY(-50%) scale(0); }
    to { transform: translateY(-50%) scale(1); }
  }

  .particle {
    position: absolute;
    pointer-events: none;
    font-size: 20px;
    animation: particleFloat 1s ease forwards;
    z-index: 150;
  }
  @keyframes particleFloat {
    from { transform: translate(0,0) scale(1); opacity: 1; }
    to { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  .screen-flash {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 50;
    border-radius: 12px;
    display: none;
  }

  /* ========== END SCREEN ========== */
  #end-screen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    background: linear-gradient(160deg, #0a0500 0%, #1a0900 100%);
    position: relative;
  }

  .confetti-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    top: -20px;
    animation: confettiFall linear forwards;
    border-radius: 2px;
  }
  @keyframes confettiFall {
    to { transform: translateY(620px) rotate(720deg); opacity: 0; }
  }

  .end-title {
    font-size: 52px;
    font-weight: 900;
    margin-bottom: 10px;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
    animation: endTitleBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
  }
  @keyframes endTitleBounce {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .end-characters {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 20px;
    margin: 10px 0;
    z-index: 10;
  }

  .end-speech {
    background: #f5f0d8;
    border: 3px solid #c8b878;
    border-radius: 14px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    color: #222;
    max-width: 200px;
    position: relative;
    text-align: center;
    z-index: 10;
    margin-bottom: 8px;
  }

  .stats-panel {
    background: rgba(0,0,0,0.6);
    border: 2px solid rgba(255,150,0,0.3);
    border-radius: 12px;
    padding: 18px 30px;
    margin: 8px 0;
    min-width: 300px;
    z-index: 10;
  }

  .stats-title {
    color: #f0d090;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(255,150,0,0.3);
    padding-bottom: 8px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    color: #ccc;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .stat-row span:last-child { color: #f0d090; font-weight: 700; }

  .end-btns {
    display: flex;
    gap: 14px;
    margin-top: 12px;
    z-index: 10;
  }

  .end-btn {
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    letter-spacing: 1px;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-play-again { background: linear-gradient(135deg, #d4920a, #f0b429); color: #000; }
  .btn-share { background: linear-gradient(135deg, #1a6ee0, #3a8ef0); color: #fff; }
  .end-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

  /* Professor animations */
  @keyframes profIdle {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes profAnger {
    0%,100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-3deg) translateY(-3px); }
    75% { transform: rotate(3deg) translateY(-3px); }
  }
  @keyframes profHappy {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.02); }
  }

  .prof-svg-wrapper { animation: profIdle 3s ease-in-out infinite; }
  .prof-svg-wrapper.angry { animation: profAnger 0.3s ease-in-out infinite; }
  .prof-svg-wrapper.happy { animation: profHappy 0.8s ease-in-out; }

  .score-popup {
    position: absolute;
    font-size: 20px;
    font-weight: 900;
    pointer-events: none;
    animation: scoreFloat 1.5s ease forwards;
    z-index: 200;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
  }
  @keyframes scoreFloat {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-60px) scale(0.8); opacity: 0; }
  }

  .key-hint {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    letter-spacing: 1px;
  }

  #game-container::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 5;
  }

  /* Topic badge */
  .topic-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 6px;
    background: rgba(255,150,0,0.2);
    border: 1px solid rgba(255,150,0,0.4);
    color: #ffb830;
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="vignette"></div>
  <div class="screen-flash" id="screen-flash"></div>

  <!-- ===== START SCREEN ===== -->
  <div class="screen active" id="start-screen">
    <div class="start-left">
      <div class="start-title">
        <div class="escape">ESCAPE</div>
        <div class="the">THE</div>
        <div class="viva">VIVA</div>
      </div>
      <div class="start-subtitle">Survive the most dangerous thing in engineering.... THE VIVA!</div>
      <button class="start-btn" onclick="startGame()">▶ START GAME</button>
    </div>
    <div class="start-student">
      <svg width="280" height="320" viewBox="0 0 280 320">
        <rect x="30" y="220" width="220" height="15" rx="4" fill="#5c3a1a"/>
        <rect x="40" y="235" width="10" height="60" rx="3" fill="#4a2e14"/>
        <rect x="230" y="235" width="10" height="60" rx="3" fill="#4a2e14"/>
        <rect x="60" y="205" width="80" height="18" rx="2" fill="#f5f0dc" transform="rotate(-3, 100, 214)"/>
        <rect x="65" y="207" width="70" height="1.5" fill="#ddd" transform="rotate(-3, 100, 214)"/>
        <rect x="65" y="211" width="60" height="1.5" fill="#ddd" transform="rotate(-3, 100, 214)"/>
        <rect x="65" y="215" width="50" height="1.5" fill="#ddd" transform="rotate(-3, 100, 214)"/>
        <rect x="150" y="200" width="60" height="22" rx="2" fill="#c0392b"/>
        <rect x="155" y="205" width="50" height="2" fill="#e74c3c"/>
        <rect x="155" y="210" width="40" height="2" fill="#e74c3c"/>
        <ellipse cx="140" cy="190" rx="55" ry="50" fill="#2980b9"/>
        <polygon points="120,150 140,170 160,150 150,145 140,155 130,145" fill="#1a5276"/>
        <ellipse cx="90" cy="215" rx="30" ry="12" fill="#2980b9"/>
        <ellipse cx="190" cy="215" rx="30" ry="12" fill="#2980b9"/>
        <ellipse cx="105" cy="215" rx="16" ry="10" fill="#f4c88e"/>
        <ellipse cx="175" cy="215" rx="16" ry="10" fill="#f4c88e"/>
        <ellipse cx="140" cy="130" rx="52" ry="56" fill="#f4c88e"/>
        <ellipse cx="140" cy="82" rx="50" ry="25" fill="#2c1810"/>
        <rect x="92" y="82" width="96" height="22" rx="0" fill="#2c1810"/>
        <ellipse cx="95" cy="105" rx="12" ry="20" fill="#2c1810"/>
        <ellipse cx="185" cy="105" rx="12" ry="20" fill="#2c1810"/>
        <ellipse cx="91" cy="133" rx="10" ry="12" fill="#f4c88e"/>
        <ellipse cx="189" cy="133" rx="10" ry="12" fill="#f4c88e"/>
        <ellipse cx="91" cy="133" rx="6" ry="8" fill="#e8b47a"/>
        <ellipse cx="189" cy="133" rx="6" ry="8" fill="#e8b47a"/>
        <ellipse cx="120" cy="125" rx="12" ry="13" fill="white"/>
        <ellipse cx="160" cy="125" rx="12" ry="13" fill="white"/>
        <ellipse cx="120" cy="127" rx="8" ry="9" fill="#3d2314"/>
        <ellipse cx="160" cy="127" rx="8" ry="9" fill="#3d2314"/>
        <ellipse cx="117" cy="124" rx="3" ry="3" fill="white"/>
        <ellipse cx="157" cy="124" rx="3" ry="3" fill="white"/>
        <path d="M110 112 Q120 106 130 112" stroke="#2c1810" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M150 112 Q160 106 170 112" stroke="#2c1810" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="175" cy="108" rx="5" ry="7" fill="#5dade2" opacity="0.9"/>
        <ellipse cx="175" cy="104" rx="2" ry="3" fill="#5dade2" opacity="0.7"/>
        <path d="M126 152 Q140 147 154 152" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="140" cy="178" rx="35" ry="8" fill="#e8b47a" opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div class="screen" id="game-screen">
    <div class="hud">
      <div class="hud-stat">
        <span class="hud-label">❤️ STRESS</span>
        <div class="bar-container">
          <div class="bar-fill stress-bar" id="stress-bar" style="width:20%"></div>
        </div>
        <span class="bar-pct stress-pct" id="stress-pct">20%</span>
      </div>
      <div class="hud-center">
        <div class="hud-q-num" id="q-counter">Q1/10</div>
      </div>
      <div class="hud-stat">
        <span class="hud-label anger-label">😤 PROF. ANGER</span>
        <div class="bar-container">
          <div class="bar-fill anger-bar" id="anger-bar" style="width:10%"></div>
        </div>
        <span class="bar-pct anger-pct" id="anger-pct">10%</span>
      </div>
    </div>

    <div class="game-area" id="game-area-wrapper">
      <div class="prof-panel">
        <div class="speech-bubble" id="speech-bubble">Hmm...</div>
        <div class="prof-character" id="prof-character">
          <div class="prof-svg-wrapper" id="prof-svg-wrapper">
            <svg id="prof-svg" width="200" height="230" viewBox="0 0 200 230">
              <ellipse cx="100" cy="185" rx="58" ry="48" fill="#1a1a2e"/>
              <ellipse cx="100" cy="175" rx="30" ry="28" fill="#eee"/>

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playTone(freq, duration, type='sine', gain=0.3, startDelay=0) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + startDelay);
    gainNode.gain.setValueAtTime(0, ctx.currentTime + startDelay);
    gainNode.gain.linearRampToValueAtTime(gain, ctx.currentTime + startDelay + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startDelay + duration);
    osc.start(ctx.currentTime + startDelay);
    osc.stop(ctx.currentTime + startDelay + duration);
  } catch(e) {}
}

// ============================================================
// SHUFFLE FUNCTION
// ============================================================
function shuffleAndPick(arr, count) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// ============================================================
// GAME STATE
// ============================================================
let questions = [];
let gameState = {
  currentQ: 0,
  stress: 20,
  anger: 10,
  score: 0,
  correctCount: 0,
  answered: false,
  totalQ: 10
};

// ============================================================
// PROFESSOR EXPRESSIONS
// ============================================================
function setProfExpression(state) {
  const wrapper = document.getElementById('prof-svg-wrapper');
  const mouthEl = document.getElementById('prof-mouth');
  const browL = document.getElementById('prof-brow-l');
  const browR = document.getElementById('prof-brow-r');
  const angryFx = document.getElementById('prof-angry-fx');
  const eyeL = document.getElementById('prof-eye-l');
  const eyeR = document.getElementById('prof-eye-r');

  wrapper.className = 'prof-svg-wrapper';
  angryFx.style.display = 'none';

  if (state === 'neutral') {
    mouthEl.setAttribute('d', 'M84 142 Q100 145 116 142');
    browL.setAttribute('d', 'M68 103 Q80 98 92 103');
    browR.setAttribute('d', 'M108 103 Q120 98 132 103');
    eyeL.setAttribute('ry', '7'); eyeR.setAttribute('ry', '7');
  } else if (state === 'angry') {
    mouthEl.setAttribute('d', 'M84 145 Q100 140 116 145');
    browL.setAttribute('d', 'M68 108 Q80 100 92 105');
    browR.setAttribute('d', 'M108 105 Q120 100 132 108');
    eyeL.setAttribute('ry', '5'); eyeR.setAttribute('ry', '5');
    wrapper.classList.add('angry');
    angryFx.style.display = 'block';
    angryFx.textContent = '💢💢';
    playAngrySound();
  } else if (state === 'very-angry') {
    mouthEl.setAttribute('d', 'M84 147 Q100 139 116 147');
    browL.setAttribute('d', 'M68 110 Q80 101 92 107');
    browR.setAttribute('d', 'M108 107 Q120 101 132 110');
    eyeL.setAttribute('ry', '4'); eyeR.setAttribute('ry', '4');
    wrapper.classList.add('angry');
    angryFx.style.display = 'block';
    angryFx.textContent = '💢🔥💢';
    flashScreen('#ff000033');
    playAngrySound();
  } else if (state === 'happy') {
    mouthEl.setAttribute('d', 'M84 140 Q100 152 116 140');
    browL.setAttribute('d', 'M68 98 Q80 93 92 98');
    browR.setAttribute('d', 'M108 98 Q120 93 132 98');

    playHappyChime();

    browR.setAttribute('d', 'M108 96 Q120 89 132 96');
    eyeL.setAttribute('ry', '10'); eyeR.setAttribute('ry', '10');
  }
}

// ============================================================
// SCREEN EFFECTS
// ============================================================
function flashScreen(color) {
  const flash = document.getElementById('screen-flash');
  flash.style.background = color || 'rgba(255,0,0,0.2)';
  flash.style.display = 'block';
  setTimeout(() => { flash.style.display = 'none'; }, 200);
}

function showStressChange(amount, isIncrease) {
  const el = document.getElementById('stress-change');
  el.style.color = isIncrease ? '#ff4c4c' : '#4cff4c';
  el.style.borderColor = isIncrease ? '#ff4c4c' : '#4cff4c';
  el.innerHTML = `STRESS ${isIncrease ? '+' : '-'}${Math.abs(amount)}<br><span style="font-size:20px">${isIncrease ? '😰😫' : '😊👍'}</span>`;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 1800);
}

function spawnParticles(isCorrect) {
  const emojis = isCorrect ? ['✨','⭐','🌟','💫'] : ['💥','😤','❌','💔'];
  for (let i = 0; i < 5; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const tx = (Math.random() - 0.5) * 100;
    const ty = -60 - Math.random() * 40;
    p.style.setProperty('--tx', tx + 'px');
    p.style.setProperty('--ty', ty + 'px');
    p.style.left = (300 + Math.random() * 200) + 'px';
    p.style.top = (150 + Math.random() * 100) + 'px';
    p.style.animationDelay = (Math.random() * 0.3) + 's';
    document.getElementById('game-area-wrapper').appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }
}

// ============================================================
// UPDATE HUD
// ============================================================
function updateHUD() {
  const s = gameState;
  document.getElementById('stress-bar').style.width = s.stress + '%';
  document.getElementById('stress-pct').textContent = s.stress + '%';
  document.getElementById('anger-bar').style.width = s.anger + '%';
  document.getElementById('anger-pct').textContent = s.anger + '%';
  document.getElementById('q-counter').textContent = `Q${s.currentQ + 1}/${s.totalQ}`;
}

// ============================================================
// LOAD QUESTION
// ============================================================
function loadQuestion() {
  const q = questions[gameState.currentQ];
  gameState.answered = false;

  // Topic badge
  document.getElementById('topic-badge').textContent = q.topic;

  // Speech bubble
  const bubble = document.getElementById('speech-bubble');
  bubble.textContent = q.professorAsk;
  bubble.style.animation = 'none';
  setTimeout(() => bubble.style.animation = 'bubbleAppear 0.3s ease', 10);

  // Question text
  document.getElementById('question-text').textContent = q.question;

  // Options
  const grid = document.getElementById('options-grid');
  const btns = grid.querySelectorAll('.option-btn');
  const letters = ['A','B','C','D'];
  btns.forEach((btn, i) => {
    btn.className = `option-btn opt-${['a','b','c','d'][i]}`;
    btn.disabled = false;
    btn.querySelector('.opt-text').textContent = q.options[i];
    btn.querySelector('.option-letter').textContent = letters[i];
  });

  setProfExpression('neutral');
  updateHUD();
}

// ============================================================
// SELECT ANSWER
// ============================================================
function selectAnswer(idx) {
  if (gameState.answered) return;
  gameState.answered = true;

  const q = questions[gameState.currentQ];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = idx === q.correct;
  btns[idx].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) btns[q.correct].classList.add('correct');

  if (isCorrect) {
    playCorrectSound();
    setProfExpression('happy');
    gameState.score += Math.max(50, 100 - Math.floor(gameState.stress / 2));
    gameState.correctCount++;

    const stressDrop = 15;
    const angerDrop = 10;
    gameState.stress = Math.max(0, gameState.stress - stressDrop);
    gameState.anger = Math.max(0, gameState.anger - angerDrop);

    showStressChange(stressDrop, false);
    spawnParticles(true);
    updateHUD();

    setTimeout(() => {
      document.getElementById('speech-bubble').textContent = q.correctReaction;
    }, 400);

    flashScreen('rgba(0,180,0,0.15)');
  } else {
    playWrongSound();
    const angerLevel = gameState.anger > 60 ? 'very-angry' : 'angry';
    setProfExpression(angerLevel);

    const stressIncrease = 20 + Math.floor(gameState.anger / 10) * 2;
    const angerIncrease = 15;
    gameState.stress = Math.min(100, gameState.stress + stressIncrease);
    gameState.anger = Math.min(100, gameState.anger + angerIncrease);

    showStressChange(stressIncrease, true);
    spawnParticles(false);
    updateHUD();

    setTimeout(() => {
      document.getElementById('speech-bubble').textContent = q.wrongReaction;
    }, 400);
    setTimeout(() => {
      document.getElementById('speech-bubble').textContent = q.wrongComment;
    }, 2200);

    flashScreen('rgba(255,0,0,0.2)');
  }

  setTimeout(() => {
    gameState.currentQ++;
    if (gameState.currentQ >= gameState.totalQ || gameState.stress >= 100) {
      showEndScreen();
    } else {
      loadQuestion();
    }
  }, 2800);
}

// ============================================================
// KEYBOARD SUPPORT
// ============================================================
document.addEventListener('keydown', (e) => {
  const keyMap = { 'a':0,'b':1,'c':2,'d':3,'A':0,'B':1,'C':2,'D':3 };
  if (keyMap[e.key] !== undefined && document.getElementById('game-screen').classList.contains('active')) {
    selectAnswer(keyMap[e.key]);
  }
});

// ============================================================
// START GAME
// ============================================================
function startGame() {
  playStartSound();

  // 🎲 Pick 10 random questions every game
  questions = shuffleAndPick(allQuestions, 10);

  gameState = {
    currentQ: 0,
    stress: 20,
    anger: 10,
    score: 0,
    correctCount: 0,
    answered: false,
    totalQ: 10
  };

  document.getElementById('start-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');
  document.getElementById('end-screen').classList.remove('active');

  loadQuestion();
}

// ============================================================
// END SCREEN
// ============================================================
function showEndScreen() {
  document.getElementById('game-screen').classList.remove('active');
  document.getElementById('end-screen').classList.add('active');

  const s = gameState;
  const endTitle = document.getElementById('end-title');
  const endChars = document.getElementById('end-characters');
  const endSpeech = document.getElementById('end-speech');

  let ending = '';
  if (s.stress >= 100) {
    ending = 'failed';
  } else if (s.correctCount >= 9) {
    ending = 'legendary';
  } else if (s.anger <= 25 && s.correctCount >= 5) {
    ending = 'adopted';
  } else {
    ending = 'escaped';
  }

  document.getElementById('stat-stress').textContent = s.stress + '%';
  document.getElementById('stat-anger').textContent = s.anger + '%';
  document.getElementById('stat-questions').textContent = s.correctCount + '/' + s.totalQ;
  document.getElementById('stat-score').textContent = s.score;

  if (ending === 'failed') {
    endTitle.textContent = 'YOU FAILED!';
    endTitle.style.color = '#e63030';
    endTitle.style.fontSize = '52px';
    playFailSound();
    endChars.innerHTML = getFailedStudentSVG();
    endSpeech.style.display = 'none';
    flashScreen('rgba(255,0,0,0.4)');
  } else if (ending === 'adopted') {
    endTitle.textContent = 'PROFESSOR ADOPTED YOU!';
    endTitle.style.color = '#f0b429';
    endTitle.style.fontSize = '34px';
    playAdoptedSound();
    endChars.innerHTML = getProfAndStudentSVG();
    endSpeech.style.display = 'block';
    endSpeech.textContent = 'Finally someone entertaining in this college! 😂';
    spawnConfetti();
  } else if (ending === 'legendary') {
    endTitle.textContent = 'CAMPUS LEGEND!';
    endTitle.style.color = '#f0b429';
    endTitle.style.fontSize = '52px';
    playEscapeSound();
    endChars.innerHTML = getLegendarySVG();
    endSpeech.style.display = 'none';
    spawnConfetti();
  } else {
    endTitle.textContent = 'YOU ESCAPED!';
    endTitle.style.color = '#4cff4c';
    endTitle.style.fontSize = '52px';
    playEscapeSound();
    endChars.innerHTML = getEscapedStudentSVG();
    endSpeech.style.display = 'none';
    spawnConfetti();
  }
}

    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    piece.style.animationDelay = Math.random() * 0.8 + 's';

    setTimeout(() => piece.remove(), 4000);
  }
}

function shareResult() {

  const endings = {
    failed: 'FAILED 💀',
    escaped: 'ESCAPED! 🎉',
    adopted: 'GOT ADOPTED BY PROFESSOR! 😂',
    legendary: 'BECAME CAMPUS LEGEND! 🏆'
  };
  const text = `🎓 Escape The Viva!\nResult: ${s.correctCount >= 9 ? endings.legendary : s.stress >= 100 ? endings.failed : endings.escaped}\nScore: ${s.score} | Stress: ${s.stress}% | Correct: ${s.correctCount}/${s.totalQ}\nCan you survive the professor? 😤`;
  if (navigator.share) {
    navigator.share({ title: 'Escape The Viva', text });
  } else {
    navigator.clipboard.writeText(text).then(() => alert('Result copied! Share it! 📋'));
  }
}

}
